<body>
<div id="marcador">
  <div class="eq"><i id="c0"></i><span id="n0"></span></div><div class="gol" id="g0">0</div>

</div>

<script type="module">
import * as THREE from "three";

// ?local=chatgpt&visita=claude&semilla=1601&vel=1   (los cerebros están en cerebros/<nombre>.js, tal como los dio cada IA)
const q = new URLSearchParams(location.search);
const EQUIPOS = await (await fetch("cerebros/equipos.json")).json();
const idL = q.get("local") || Object.keys(EQUIPOS)[0], idV = q.get("visita") || Object.keys(EQUIPOS)[1];
const semilla = Number(q.get("semilla") || 1), VEL = Number(q.get("vel") || 1), SIN_REP = q.has("sinrep"), PRORROGA = Number(q.get("prorroga") || 0), ESCALA = Number(q.get("escala") || 1.25);
// «mio» = el equipo que pegaste en la página de inicio (se guarda solo en tu navegador)
let MIO = null; try { MIO = JSON.parse(localStorage.getItem("mundial_mio") || "null"); } catch (e) {}
const cargar = async (id) => id === "mio" && MIO ? { ia: "Tu equipo", nombre: MIO.nombre || "Tu equipo", color: "#a855f7", codigo: MIO.codigo }
  : Object.assign({ codigo: await (await fetch("cerebros/" + EQUIPOS[id].archivo)).text() }, EQUIPOS[id]);
const local = await cargar(idL), visita = await cargar(idV);
// reloj fijo: en el torneo oficial (Node) ningún equipo tuvo turnos lentos; aquí el equipo está ocupado dibujando o
// grabando, y un turno «lento» por culpa nuestra cambiaría el partido. Así la transmisión repite el resultado oficial.
const P = new Mundial.Partido(local, visita, { semilla, prorroga: PRORROGA, reloj: () => 0 });
const C = Mundial.C;
window.partido = P;

const $ = (id) => document.getElementById(id);
$("n0").textContent = local.nombre; $("n1").textContent = visita.nombre;
$("c0").style.background = local.color; $("c1").style.background = visita.color;
$("pie").textContent = `${local.ia} vs ${visita.ia} · semilla ${semilla} · el código de cada equipo lo escribió la IA, sin retoques`;

// ---------- Escena ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const escena = new THREE.Scene();
const camara = new THREE.PerspectiveCamera(28, 16 / 9, 1, 900);

function lienzo(w, h, pintar) { const c = document.createElement("canvas"); c.width = w; c.height = h; pintar(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
async function textura(ruta, respaldo) {          // imagen propia si existe (texturas/…), si no, la dibujada por código
  try { const r = await fetch(ruta, { method: "HEAD" }); if (!r.ok) throw 0;
    const t = await new THREE.TextureLoader().loadAsync(ruta); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
  catch (e) { return respaldo(); }
}

// Cielo
const cielo = await textura("texturas/cielo.jpg", () => lienzo(16, 512, (g, w, h) => { const d = g.createLinearGradient(0, 0, 0, h);
  d.addColorStop(0, "#2f6fc4"); d.addColorStop(.55, "#8fc1ee"); d.addColorStop(1, "#dcecf8"); g.fillStyle = d; g.fillRect(0, 0, w, h); }));
escena.add(new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), new THREE.MeshBasicMaterial({ map: cielo, side: THREE.BackSide, fog: false })));
escena.fog = new THREE.Fog(0xcfe3f5, 260, 720);

// Luz de tarde con sombras
escena.add(new THREE.HemisphereLight(0xdfeeff, 0x3a5a2a, 0.85));
const sol = new THREE.DirectionalLight(0xfff1d6, 2.3);
sol.position.set(-70, 95, 60); sol.castShadow = true; sol.shadow.mapSize.set(4096, 4096);
Object.assign(sol.shadow.camera, { left: -75, right: 75, top: 55, bottom: -55, near: 10, far: 300 }); sol.shadow.bias = -0.0004;
escena.add(sol);

// Césped con franjas y líneas
const PX = 20;                                       // píxeles por metro
const margen = 8;
const cesped = lienzo((C.LARGO + 2 * margen) * PX, (C.ANCHO + 2 * margen) * PX, (g, w, h) => {
  for (let i = 0; i < 26; i++) { g.fillStyle = i % 2 ? "#3f8f3a" : "#48a043"; g.fillRect(i * w / 26, 0, w / 26 + 1, h); }
  const im = g.getImageData(0, 0, w, h), d = im.data;                // grano del pasto
  for (let i = 0; i < d.length; i += 4) { const r = (Math.random() - .5) * 22; d[i] += r * .6; d[i + 1] += r; d[i + 2] += r * .5; }
  g.putImageData(im, 0, 0);
  g.translate(margen * PX, margen * PX); g.strokeStyle = "rgba(255,255,255,.93)"; g.lineWidth = 0.14 * PX; g.lineCap = "square";
  const L = C.LARGO * PX, A = C.ANCHO * PX, m = (v) => v * PX;
  g.strokeRect(0, 0, L, A); g.beginPath(); g.moveTo(L / 2, 0); g.lineTo(L / 2, A); g.stroke();
  g.beginPath(); g.arc(L / 2, A / 2, m(9.15), 0, 7); g.stroke();
  g.fillStyle = "#fff"; g.beginPath(); g.arc(L / 2, A / 2, m(.25), 0, 7); g.fill();
  for (const s of [0, 1]) { g.save(); if (s) { g.translate(L, A); g.rotate(Math.PI); }
    g.strokeRect(0, A / 2 - m(20.16), m(16.5), m(40.32)); g.strokeRect(0, A / 2 - m(9.16), m(5.5), m(18.32));
    g.beginPath(); g.arc(m(11), A / 2, m(.25), 0, 7); g.fill();
    g.beginPath(); g.arc(m(11), A / 2, m(9.15), -0.925, 0.925); g.stroke();
    g.beginPath(); g.arc(0, 0, m(1), 0, Math.PI / 2); g.stroke(); g.beginPath(); g.arc(0, A, m(1), -Math.PI / 2, 0); g.stroke(); g.restore(); }
});
const piso = new THREE.Mesh(new THREE.PlaneGeometry(C.LARGO + 2 * margen, C.ANCHO + 2 * margen),
  new THREE.MeshStandardMaterial({ map: cesped, roughness: .95 }));
piso.rotation.x = -Math.PI / 2; piso.receiveShadow = true; escena.add(piso);
const pista = new THREE.Mesh(new THREE.PlaneGeometry(260, 220), new THREE.MeshStandardMaterial({ color: 0x7a3b2e, roughness: 1 }));
pista.rotation.x = -Math.PI / 2; pista.position.y = -0.05; pista.receiveShadow = true; escena.add(pista);

// Tribunas con público, vallas y techo
const publico = await textura("texturas/publico.jpg", () => lienzo(1024, 512, (g, w, h) => {
  g.fillStyle = "#1c2433"; g.fillRect(0, 0, w, h);
  const col = ["#e11d48", "#f8fafc", "#1d4ed8", "#facc15", "#0f172a", "#22c55e", "#f97316", "#e2e8f0", "#94a3b8"];
  for (let y = 6; y < h; y += 9) for (let x = (y % 18 ? 3 : 7); x < w; x += 8) { if (Math.random() < .08) continue;
    g.fillStyle = col[Math.floor(Math.random() * col.length)]; g.fillRect(x, y + 3, 5, 5);
    g.fillStyle = ["#e8b98f", "#c68b5c", "#8a5a3a", "#f1cda8"][Math.floor(Math.random() * 4)]; g.fillRect(x + 1, y, 3, 3); } }));
publico.wrapS = publico.wrapT = THREE.RepeatWrapping;
function tribuna(ancho, x, z, giro) {
  const g = new THREE.Group(); const alto = 26, fondo = 30;
  const t = publico.clone(); t.needsUpdate = true; t.repeat.set(ancho / 40, 1.6);
  const grada = new THREE.Mesh(new THREE.PlaneGeometry(ancho, Math.hypot(alto, fondo)), new THREE.MeshStandardMaterial({ map: t, roughness: 1 }));
  grada.rotation.x = -Math.atan2(fondo, alto); grada.position.set(0, alto / 2 + 2.5, -fondo / 2); g.add(grada);
  const muro = new THREE.Mesh(new THREE.BoxGeometry(ancho, 2.5, 1), new THREE.MeshStandardMaterial({ color: 0x1e293b })); muro.position.y = 1.25; g.add(muro);
  const techo = new THREE.Mesh(new THREE.BoxGeometry(ancho + 6, 1.2, 26), new THREE.MeshStandardMaterial({ color: 0xe5e7eb, roughness: .6 }));
  techo.position.set(0, alto + 9, -fondo + 9); techo.rotation.x = 0.1; techo.castShadow = false; g.add(techo);
  const atras = new THREE.Mesh(new THREE.BoxGeometry(ancho + 6, alto + 10, 2), new THREE.MeshStandardMaterial({ color: 0x334155 })); atras.position.set(0, (alto + 10) / 2, -fondo - 1); g.add(atras);
  g.position.set(x, 0, z); g.rotation.y = giro; escena.add(g);
}
const fx = C.LARGO / 2 + 14, fz = C.ANCHO / 2 + 12;
tribuna(C.LARGO + 60, 0, -fz, 0); tribuna(C.LARGO + 60, 0, fz, Math.PI);
tribuna(C.ANCHO + 30, -fx, 0, Math.PI / 2); tribuna(C.ANCHO + 30, fx, 0, -Math.PI / 2);
const valla = await textura("texturas/valla.jpg", () => lienzo(2048, 64, (g, w, h) => { g.fillStyle = "#0b1220"; g.fillRect(0, 0, w, h);
  g.font = "900 44px Segoe UI, Arial"; g.textBaseline = "middle";
  g.textAlign = "center";
  for (let i = 0; i < 4; i++) { g.fillStyle = i % 2 ? "#38bdf8" : "#ffffff"; g.fillText(i % 2 ? "MUNDIAL DE LAS IA" : "MenteXYZ", (i + .5) * w / 4, h / 2 + 2); } }));
for (const s of [-1, 1]) {
  const v = new THREE.Mesh(new THREE.BoxGeometry(C.LARGO + 6, 1, .3), new THREE.MeshStandardMaterial({ map: valla, emissive: 0xffffff, emissiveMap: valla, emissiveIntensity: .35 }));
  v.position.set(0, .5, s * (C.ANCHO / 2 + 5)); if (s > 0) v.rotation.y = Math.PI; escena.add(v);
}

// Arcos con red
function arco(x, s) {
  const g = new THREE.Group(), m = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .4 });
  const palo = (l) => new THREE.Mesh(new THREE.CylinderGeometry(.07, .07, l, 10), m);
  for (const z of [-C.ARCO / 2, C.ARCO / 2]) { const p = palo(2.44); p.position.set(0, 1.22, z); p.castShadow = true; g.add(p); }
  const t = palo(C.ARCO); t.rotation.x = Math.PI / 2; t.position.set(0, 2.44, 0); t.castShadow = true; g.add(t);
  const red = lienzo(256, 256, (c, w, h) => { c.clearRect(0, 0, w, h); c.strokeStyle = "rgba(255,255,255,.75)"; c.lineWidth = 1.5;
    for (let i = 0; i <= w; i += 16) { c.beginPath(); c.moveTo(i, 0); c.lineTo(i, h); c.stroke(); c.beginPath(); c.moveTo(0, i); c.lineTo(w, i); c.stroke(); } });
  const mr = new THREE.MeshBasicMaterial({ map: red, transparent: true, side: THREE.DoubleSide, depthWrite: false });
  const fondo = new THREE.Mesh(new THREE.PlaneGeometry(C.ARCO, 2.44), mr); fondo.rotation.y = Math.PI / 2; fondo.position.set(s * 2, 1.22, 0); g.add(fondo);
  const tech = new THREE.Mesh(new THREE.PlaneGeometry(2, C.ARCO), mr); tech.rotation.x = Math.PI / 2; tech.rotation.z = Math.PI / 2; tech.position.set(s * 1, 2.44, 0); g.add(tech);
  for (const z of [-C.ARCO / 2, C.ARCO / 2]) { const l = new THREE.Mesh(new THREE.PlaneGeometry(2, 2.44), mr); l.position.set(s * 1, 1.22, z); g.add(l); }
  g.position.x = x; escena.add(g);
}
arco(-C.LARGO / 2, -1); arco(C.LARGO / 2, 1);

// Jugadores (video 18, pedido de Marino: «que no se muevan como maniquíes»). Cuerpo con cadera, columna, cuello,
// hombro-codo-mano y cadera-rodilla-tobillo. La transmisión solo DIBUJA: posiciones y velocidades salen del motor.
function camiseta(color, n) { return lienzo(256, 128, (g, w, h) => { g.fillStyle = color; g.fillRect(0, 0, w, h);
  const cl = parseInt(color.slice(1, 3), 16) + parseInt(color.slice(3, 5), 16) + parseInt(color.slice(5, 7), 16) > 600;   // camiseta clara: número oscuro
  g.fillStyle = cl ? "rgba(15,23,42,.92)" : "rgba(255,255,255,.92)"; g.font = "900 64px Arial"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(String(n + 1), w / 2, h * .42); g.fillRect(0, 0, w, 7); }); }
const PIEL = [0xe8b98f, 0xc68b5c, 0x8a5a3a, 0xf1cda8, 0x6b4226], PELO = [0x111111, 0x2b1a10, 0x5a3a1a, 0x1a1a1a, 0xb08a4a];
function jugador(color, n, arquero, sp) {
  const g = new THREE.Group(), tela = arquero ? "#facc15" : color;
  const mat = (c, r) => new THREE.MeshStandardMaterial({ color: c, roughness: r === undefined ? .8 : r });
  const mt = new THREE.MeshStandardMaterial({ map: camiseta(tela, n), roughness: .8 }), mmanga = mat(tela);
  const mp = mat(PIEL[sp % PIEL.length], .7), mc = mat(arquero ? 0x111827 : (tela.toLowerCase() === "#f1f5f9" ? 0x1e293b : 0xf8fafc)), mm = mat(arquero ? 0x111827 : tela);
  const mz = mat(0x151515, .45), mh = mat(PELO[(sp >> 1) % PELO.length], .9), mg = arquero ? mat(0xf8fafc, .6) : mp;
  const mk = (padre, geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; padre.add(o); return o; };
  const gr = (padre, x, y, z) => { const o = new THREE.Group(); o.position.set(x, y, z); padre.add(o); return o; };
  const cuerpo = gr(g, 0, 0, 0), cadera = gr(cuerpo, 0, .93, 0), tronco = gr(cadera, 0, .04, 0);
  mk(cadera, new THREE.SphereGeometry(.17, 14, 10), mc, 0, -.02, 0).scale.set(.8, .72, 1.08);
  const torso = mk(tronco, new THREE.CapsuleGeometry(.185, .25, 5, 14), mt, 0, .31, 0); torso.scale.set(1.04, 1, .66); torso.rotation.y = Math.PI / 2;   // el número queda en la espalda
  const cuello = gr(tronco, 0, .59, 0); mk(cuello, new THREE.CylinderGeometry(.045, .05, .1, 8), mp, 0, .02, 0);
  const cabeza = gr(cuello, 0, .16, 0); mk(cabeza, new THREE.SphereGeometry(.118, 16, 12), mp, 0, 0, 0).scale.set(1, 1.1, .92);
  const estilo = sp % 4;                                // pelo: corto, rapado, con volumen, calvo
  if (estilo < 3) mk(cabeza, new THREE.SphereGeometry(.124, 16, 12, 0, Math.PI * 2, 0, Math.PI * (estilo === 1 ? .42 : .56)), mh, -.012, estilo === 2 ? .03 : .012, 0)
    .scale.set(1, estilo === 2 ? 1.22 : 1.1, .95);
  mk(cabeza, new THREE.SphereGeometry(.02, 6, 5), mp, .118, -.01, 0);          // nariz: se nota hacia dónde mira
  const brazo = (s) => { const h = gr(tronco, 0, .5, s * .235); mk(h, new THREE.SphereGeometry(.068, 10, 8), mmanga, 0, 0, 0);
    mk(h, new THREE.CapsuleGeometry(.047, .2, 3, 8), mmanga, 0, -.14, 0);
    const c = gr(h, 0, -.28, 0); mk(c, new THREE.SphereGeometry(.045, 8, 6), mp, 0, 0, 0); mk(c, new THREE.CapsuleGeometry(.039, .2, 3, 8), mp, 0, -.12, 0); mk(c, new THREE.SphereGeometry(arquero ? .062 : .046, 8, 6), mg, 0, -.26, 0);
    return { h, c, s }; };
  const pierna = (s) => { const m = gr(cadera, 0, -.04, s * .095); mk(m, new THREE.CapsuleGeometry(.074, .3, 3, 10), mp, 0, -.21, 0);
    mk(m, new THREE.CapsuleGeometry(.09, .1, 3, 10), mc, 0, -.1, 0);                 // pantaloneta
    const r = gr(m, 0, -.42, 0); mk(r, new THREE.SphereGeometry(.068, 10, 8), mp, 0, 0, 0); mk(r, new THREE.CapsuleGeometry(.056, .3, 3, 10), mm, 0, -.2, 0);   // media
    const t = gr(r, 0, -.4, 0); mk(t, new THREE.SphereGeometry(.06, 8, 6), mz, 0, -.01, 0); mk(t, new THREE.BoxGeometry(.25, .085, .1), mz, .06, -.045, 0);
    return { m, r, t, s }; };
  g.p = { cuerpo, cadera, tronco, cuello, brazos: [brazo(-1), brazo(1)], piernas: [pierna(-1), pierna(1)] };
  g.fase = Math.random() * 6; g.yaw = null; g.vp = [0, 0]; g.ac = 0; g.pose = null; g.ant = [0, 0]; return g;
}
const figuras = P.jug.map((j, i) => { const f = jugador(P.equipos[j.e].color, j.n, j.n === 0, i * 7 + j.n * 3); f.scale.setScalar(ESCALA); escena.add(f); return f; });


// Balón
const pelota = new THREE.Mesh(new THREE.SphereGeometry(.22, 20, 16), new THREE.MeshStandardMaterial({ map: lienzo(256, 128, (g, w, h) => {
  g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.fillStyle = "#111"; for (let i = 0; i < 12; i++) { g.beginPath(); g.arc((i % 6) * 44 + (i > 5 ? 22 : 0) + 12, i > 5 ? 90 : 38, 11, 0, 7); g.fill(); } }), roughness: .35 }));
pelota.castShadow = true; escena.add(pelota);

// ---------- Transmisión ----------
// ?grabar=nombre&tramos=20-35,60-75 graba esos tramos (segundos de juego) cuadro a cuadro, a 1920x1080, y los manda al
// servidor local (herramientas/servidor16.py), que arma el .mp4. La transmisión solo DIBUJA lo que calcula el motor.
const X = (x) => x - C.LARGO / 2, Z = (y) => y - C.ANCHO / 2;
const ZOOM = Number(q.get("zoom") || 1);     // ?zoom=3: plano cerrado que sigue el balón (para ver a los jugadores de cerca)
const VERT = q.has("vertical");               // tomas verticales (1080x1920) para Shorts: la cámara sigue el balón de cerca
const GRABAR = q.get("grabar"), REP_SEG = Number(q.get("rep") || 4), FPS = Number(q.get("fps") || 30);
const TRAMOS = (q.get("tramos") || "").split(",").filter(Boolean).map((s) => s.split("-").map(Number));
const DUR = { cabezazo: .7, volea: .55, chilena: .95, centro: .5, tiro: .5, atajada: .8, escapa: .8, festejo: 99, lamento: 99 };
const ROTULO = { cabezazo: "¡CABEZAZO!", volea: "¡VOLEA!", chilena: "¡CHILENA!", centro: "CENTRO AL ÁREA" };
const accion = P.jug.map(() => null);
const cual = (e, n) => P.jug.findIndex((j) => j.e === e && j.n === n);
let vistosAcc = 0;
function acciones() {                       // cada jugada aérea, tiro o atajada del motor mueve la figura que la hizo
  for (; vistosAcc < P.eventos.length; vistosAcc++) { const e = P.eventos[vistosAcc];
    if (!DUR[e.tipo]) continue; const i = cual(e.equipo, e.n === undefined ? 0 : e.n); if (i < 0) continue;
    if (e.tipo === "tiro" && accion[i] && P.t - accion[i].t0 < .05) continue;      // el mismo toque ya fue cabezazo o chilena
    accion[i] = { tipo: e.tipo, t0: P.t, s: Math.sign(P.balon.y - P.jug[i].y) || 1 }; }
}
const foto = () => ({ b: [P.balon.x, P.balon.y, Math.hypot(P.balon.vx, P.balon.vy), P.balon.z || 0],
  j: P.jug.map((j, i) => { const a = accion[i];
    return a && P.t - a.t0 < DUR[a.tipo] ? [j.x, j.y, j.vx, j.vy, j.ang, a.tipo, P.t - a.t0, a.s] : [j.x, j.y, j.vx, j.vy, j.ang]; }) });

  const of = await (await fetch("torneo.json")).json(), ex = await fetch("extra.json").then((r) => r.ok ? r.json() : { partidos: [] }).catch(() => ({ partidos: [] })), par = of.partidos.concat(of.espejo || [], of.semis || [], of.final ? [of.final] : [], ex.partidos).find((p) => p.semilla === semilla && p.local === idL && p.visita === idV);
  const firma = (l) => l.filter((e) => e.t <= P.t + 1e-6).map((e) => e.t.toFixed(2) + "/" + e.equipo).join(" ");
  const igual = par ? firma(par.resumen.goles) === firma(P.eventos.filter((e) => e.tipo === "gol")) : false;
  await fetch("/fin?nombre=" + GRABAR + "&igual=" + (igual ? 1 : 0) + "&ms=" + Math.round(ms[0] / n) + "_" + Math.round(ms[1] / n), { method: "POST" }); document.title = "LISTO " + n; window.listo = n;
}

function cuadro(ahora) { const dt = Math.min(.05, (ahora - antes) / 1000); antes = ahora; avanzarCuadro(dt); requestAnimationFrame(cuadro); }
// Para revisar un momento del partido sin esperar (consola): saltar(30) adelanta 30 segundos de juego.
window.saltar = (seg) => { const n = Math.round(seg / C.DT); adelantando = true; for (let i = 0; i < n && !P.terminado; i++) simular(); eventos(); reloj(); adelantando = false;
  repeticion = null; congelado = null; pintar(actual, .016); camaraTv(actual, 0, null, true); renderer.render(escena, camara); return P.t; };
window.cuadros = (n, dt) => { for (let i = 0; i < n; i++) avanzarCuadro(dt || 1 / 30); return P.t; };   // avanzar a mano (pestaña oculta)
if (GRABAR) grabar(); else { camaraTv(actual, 1); requestAnimationFrame(cuadro); }
</script>
